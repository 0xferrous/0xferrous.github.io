name: Zola

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      
    - name: Install Nix
      uses: DeterminateSystems/nix-installer-action@main
      
    - name: Setup Nix cache
      uses: DeterminateSystems/magic-nix-cache-action@main
      
    - name: Build website for IPFS
      run: nix run .#build-ipfs

    - name: Upload to pinata
      id: pinata
      uses: ./.github/actions/pinata-upload
      with:
        pinata-jwt: ${{ secrets.PINATA_JWT }}
        build-location: './public'
        pin-alias: "${{ github.event_name == 'pull_request' && format('pull_request_{0}', github.head_ref) || 'main' }}"
        cid-version: '1'
        github-token: ${{ secrets.GITHUB_TOKEN }}
        ipns-name: ${{ secrets.IPNS_NAME }}
        filebase-access-key: ${{ secrets.FILEBASE_ACCESS_KEY }}
        filebase-secret-key: ${{ secrets.FILEBASE_SECRET_KEY }}

    - name: Build website for GitHub Pages
      run: nix run .#build-github

    - name: Setup Pages
      uses: actions/configure-pages@v4

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: './public'
        
  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
